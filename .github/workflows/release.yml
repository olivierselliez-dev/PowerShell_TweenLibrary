name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Targeted Zip Archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "Tweens", "Documentations", "README.md" -DestinationPath "PowerShell_TweenLibrary-$tag.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PowerShell_TweenLibrary-*.zip
          generate_release_notes: true
